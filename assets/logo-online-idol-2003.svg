<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Logo Online Idol 2003 : un micro vintage doré sous une étoile, dans un médaillon doré">
  <defs>
    <linearGradient id="orLogo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a24"/>
      <stop offset="0.30" stop-color="#d9b45f"/>
      <stop offset="0.52" stop-color="#f6e3a1"/>
      <stop offset="0.74" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#7c5f1f"/>
    </linearGradient>
    <linearGradient id="orTexte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset="0.6" stop-color="#e7b34b"/>
      <stop offset="1" stop-color="#c9a24f"/>
    </linearGradient>
    <linearGradient id="grilleLogo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d4a1e"/>
      <stop offset="0.5" stop-color="#3f3312"/>
      <stop offset="1" stop-color="#5d4a1e"/>
    </linearGradient>
    <radialGradient id="fondLogo" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#2b402c"/>
      <stop offset="1" stop-color="#1d2b1e"/>
    </radialGradient>
    <radialGradient id="haloLogo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2dc9b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2dc9b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo doux -->
  <circle cx="150" cy="150" r="148" fill="url(#haloLogo)"/>

  <!-- le médaillon -->
  <circle cx="150" cy="150" r="138" fill="url(#fondLogo)" stroke="url(#orLogo)" stroke-width="5"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="#c9a24f" stroke-width="1.4" opacity="0.65"/>

  <!-- étoile dorée -->
  <path d="M150 30 L154.9 44.1 L169.8 44.5 L158 53.7 L162.1 68.1 L150 59.6 L137.9 68.1 L142 53.7 L130.2 44.5 L145.1 44.1 Z" fill="url(#orTexte)"/>

  <!-- étincelles -->
  <path d="M62 108 L64.2 115 L71.2 117.2 L64.2 119.4 L62 126.4 L59.8 119.4 L52.8 117.2 L59.8 115 Z" fill="#e7b34b" opacity="0.85"/>
  <path d="M238 108 L240.2 115 L247.2 117.2 L240.2 119.4 L238 126.4 L235.8 119.4 L228.8 117.2 L235.8 115 Z" fill="#e7b34b" opacity="0.85"/>

  <!-- micro vintage : tête -->
  <path d="M127 96 a23 30 0 0 1 46 0 l0 20 a23 18 0 0 1 -46 0 Z" fill="url(#grilleLogo)" stroke="url(#orLogo)" stroke-width="4"/>
  <path d="M129.5 86 a21 23 0 0 1 41 0" fill="none" stroke="#e9cf87" stroke-width="2" opacity="0.8"/>
  <path d="M128.5 96 h43 M129.5 106 h41 M131.5 116 h37" stroke="#c9a24f" stroke-width="2.2" opacity="0.85" fill="none"/>
  <!-- micro vintage : berceau, tige, base -->
  <path d="M114 108 a36 36 0 0 0 72 0" fill="none" stroke="url(#orLogo)" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 146 L150 162" stroke="url(#orLogo)" stroke-width="6" stroke-linecap="round"/>
  <path d="M128 166 L172 166" stroke="url(#orLogo)" stroke-width="6" stroke-linecap="round"/>

  <!-- le nom du concours -->
  <text x="150" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="31" letter-spacing="3.5" fill="url(#orTexte)">ONLINE IDOL</text>
  <text x="150" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="9" fill="#e7b34b">2003</text>
</svg>
