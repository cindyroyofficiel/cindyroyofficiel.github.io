<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Médaillon doré : une croix entourée d'un chapelet, avec une colombe">
  <defs>
    <linearGradient id="orCroix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a24"/>
      <stop offset="0.30" stop-color="#d9b45f"/>
      <stop offset="0.52" stop-color="#f6e3a1"/>
      <stop offset="0.74" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#7c5f1f"/>
    </linearGradient>
    <linearGradient id="orClair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset="0.55" stop-color="#e7b34b"/>
      <stop offset="1" stop-color="#c9a24f"/>
    </linearGradient>
    <radialGradient id="fondCroix" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#2b402c"/>
      <stop offset="1" stop-color="#1d2b1e"/>
    </radialGradient>
    <radialGradient id="haloCroix" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2dc9b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2dc9b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo doux -->
  <circle cx="120" cy="120" r="118" fill="url(#haloCroix)"/>

  <!-- le médaillon -->
  <circle cx="120" cy="120" r="103" fill="url(#fondCroix)" stroke="url(#orCroix)" stroke-width="5"/>
  <circle cx="120" cy="120" r="93" fill="none" stroke="#c9a24f" stroke-width="1.4" opacity="0.65"/>

  <!-- le chapelet : les grains en cercle -->
  <g fill="url(#orClair)">
    <circle cx="169.2" cy="153.9" r="4.4"/>
    <circle cx="160.9" cy="166.7" r="4.4"/>
    <circle cx="149.4" cy="176.3" r="4.4"/>
    <circle cx="135.4" cy="182.3" r="4.4"/>
    <circle cx="120.0" cy="184.0" r="4.4"/>
    <circle cx="104.6" cy="182.3" r="4.4"/>
    <circle cx="90.6" cy="176.3" r="4.4"/>
    <circle cx="79.1" cy="166.7" r="4.4"/>
    <circle cx="70.8" cy="153.9" r="4.4"/>
    <circle cx="66.5" cy="138.8" r="4.4"/>
    <circle cx="66.5" cy="123.2" r="4.4"/>
    <circle cx="70.8" cy="108.1" r="4.4"/>
    <circle cx="79.1" cy="95.3" r="4.4"/>
    <circle cx="90.6" cy="85.7" r="4.4"/>
    <circle cx="104.6" cy="79.7" r="4.4"/>
    <circle cx="120.0" cy="78.0" r="4.4"/>
    <circle cx="135.4" cy="79.7" r="4.4"/>
    <circle cx="149.4" cy="85.7" r="4.4"/>
    <circle cx="160.9" cy="95.3" r="4.4"/>
    <circle cx="169.2" cy="108.1" r="4.4"/>
    <circle cx="173.5" cy="123.2" r="4.4"/>
    <circle cx="173.5" cy="138.8" r="4.4"/>
  </g>

  <!-- la croix, au centre -->
  <path d="M114 88 L126 88 L126 108 L146 108 L146 120 L126 120 L126 168 L114 168 L114 120 L94 120 L94 108 L114 108 Z" fill="url(#orCroix)"/>

  <!-- la colombe, en haut à droite, ailes ouvertes -->
  <g fill="#fdf8ef" stroke="#c9a24f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M186 38 C179 35, 172 35, 166 37 C171 41, 175 45, 177 50 Z"/>
    <path d="M168 38 C161 30, 152 25, 143 25 C149 30, 153 36, 155 42 C149 40, 142 40, 136 43 C143 49, 152 51, 159 50 C157 57, 158 64, 162 69 C166 62, 169 49, 168 38 Z"/>
    <path d="M163 62 C169 64, 175 64, 180 62 C175 66, 169 68, 163 68 Z"/>
  </g>
  <circle cx="162" cy="49" r="1.8" fill="#7c5f1f" stroke="none"/>

  <!-- étincelles -->
  <path d="M52 66 L53.8 71.7 L59.5 73.5 L53.8 75.3 L52 81 L50.2 75.3 L44.5 73.5 L50.2 71.7 Z" fill="#e7b34b" opacity="0.85"/>
  <path d="M190 178 L191.6 183.1 L196.7 184.7 L191.6 186.3 L190 191.4 L188.4 186.3 L183.3 184.7 L188.4 183.1 Z" fill="#e7b34b" opacity="0.8"/>
</svg>
